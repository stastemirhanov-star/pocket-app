<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAFRONIX GRAFICS OTC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0b0b12;
            --bg-card: #1a1a2e;
            --gold: #f5a623;
            --gold-gradient: linear-gradient(135deg, #f5a623, #f7931e);
            --text-primary: #ffffff;
            --text-secondary: #9a9abf;
            --text-muted: #5a5a7a;
            --border-color: rgba(245, 166, 35, 0.12);
            --shadow-gold: 0 8px 32px rgba(245, 166, 35, 0.15);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px 16px 30px;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0b0b12 70%);
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 480px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--gold-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #0b0b12;
            box-shadow: 0 4px 20px rgba(245, 166, 35, 0.25);
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            font-size: 11px;
            font-weight: 600;
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(76, 175, 80, 0.2);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .pair-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .pair-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .pair-btn:hover {
            border-color: rgba(245, 166, 35, 0.3);
            color: #fff;
        }
        .pair-btn.active {
            background: var(--gold-gradient);
            border-color: var(--gold);
            color: #0b0b12;
            box-shadow: 0 4px 20px rgba(245, 166, 35, 0.25);
        }
        .tf-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .tf-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .tf-btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .tf-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(245, 166, 35, 0.06);
        }
        .forecast-btn {
            width: 100%;
            padding: 18px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 14px;
            color: #0b0b12;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 30px rgba(245, 166, 35, 0.2);
        }
        .forecast-btn:active { transform: scale(0.97); }
        .forecast-btn:disabled {
            opacity: 0.5;
            transform: scale(0.98);
            box-shadow: none;
        }
        .result-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin: 16px 0;
            border: 1px solid var(--border-color);
            min-height: 100px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: var(--text-secondary); font-size: 14px; }
        .result-value { font-weight: 700; font-size: 16px; }
        .result-value.buy { color: #4caf50; }
        .result-value.sell { color: #ef5350; }
        .result-value.hold { color: #ffeb3b; }
        .result-reason {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 3px solid var(--gold);
        }
        .best-pair-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-top: 16px;
            border: 1px solid var(--gold);
            box-shadow: var(--shadow-gold);
        }
        .best-pair-box .title {
            color: var(--gold);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .best-pair-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px;
        }
        .best-pair-item:last-child { border-bottom: none; }
        .best-signal-buy { color: #4caf50; font-weight: 700; }
        .best-signal-sell { color: #ef5350; font-weight: 700; }
        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 0.5px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .footer span { color: var(--gold); }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="logo">
            <div class="logo-icon">✦</div>
            <span class="logo-text">SAFRONIX GRAFICS OTC</span>
        </div>
        <span class="status-badge">LIVE</span>
    </div>

    <div class="pair-selector" id="pair-selector">
        <button class="pair-btn active" data-pair="EURUSD-OTC">EURUSD-OTC</button>
        <button class="pair-btn" data-pair="GBPUSD-OTC">GBPUSD-OTC</button>
        <button class="pair-btn" data-pair="USDJPY-OTC">USDJPY-OTC</button>
        <button class="pair-btn" data-pair="BTCUSD-OTC">BTCUSD-OTC</button>
        <button class="pair-btn" data-pair="ETHUSD-OTC">ETHUSD-OTC</button>
        <button class="pair-btn" data-pair="XRPUSD-OTC">XRPUSD-OTC</button>
        <button class="pair-btn" data-pair="LTCUSD-OTC">LTCUSD-OTC</button>
        <button class="pair-btn" data-pair="DOGEUSD-OTC">DOGEUSD-OTC</button>
    </div>

    <div class="tf-selector" id="tf-selector">
        <button class="tf-btn active" data-tf="3">3с</button>
        <button class="tf-btn" data-tf="5">5с</button>
        <button class="tf-btn" data-tf="15">15с</button>
        <button class="tf-btn" data-tf="30">30с</button>
        <button class="tf-btn" data-tf="60">1м</button>
        <button class="tf-btn" data-tf="300">5м</button>
        <button class="tf-btn" data-tf="900">15м</button>
    </div>

    <button class="forecast-btn" id="forecast-btn">
        <span class="btn-icon">📊</span> АНАЛИЗ
    </button>

    <div class="result-card" id="result-box">
        <div style="color:var(--text-muted); text-align:center; padding:16px 0;">
            Выберите валюту и время → нажмите «Анализ»
        </div>
    </div>

    <div class="best-pair-box" id="best-pair-box">
        <div class="title">🏆 ЛУЧШАЯ ВАЛЮТА ДЛЯ СДЕЛКИ</div>
        <div id="best-pair-list">
            <div style="color:var(--text-muted); font-size:13px;">Загрузка...</div>
        </div>
    </div>

    <div class="footer">SAFRONIX GRAFICS OTC · <span>AI</span> · 24/7</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentPair = 'EURUSD-OTC';
    let currentTf = 3;

    const API_URL = 'http://192.168.1.122:5000';

    async function getSignalFromBackend(pair, tf) {
        try {
            const response = await fetch(`${API_URL}/api/signal/${encodeURIComponent(pair)}`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            return data;
        } catch (e) {
            console.warn('Бэкенд не отвечает, использую эмуляцию:', e);
            return null;
        }
    }

    async function getBestPairs() {
        try {
            const response = await fetch(`${API_URL}/api/best`);
            return await response.json();
        } catch (e) {
            console.warn('Не удалось получить лучшие валюты:', e);
            return [];
        }
    }

    function generateEmulation(pair, tf) {
        const signals = ['BUY ▲', 'SELL ▼', 'HOLD ⚪'];
        const cls = ['buy', 'sell', 'hold'];
        const idx = Math.floor(Math.random() * 3);
        const reasons = [
            'RSI=28.3 (перепроданность), цена выше SMA5, тренд вверх → BUY',
            'RSI=72.5 (перекупленность), цена ниже SMA20, тренд вниз → SELL',
            'RSI=52.0 (нейтрально), цена около SMA, тренд слабый → HOLD'
        ];
        return {
            pair: pair,
            price: (1.2000 + (Math.random() - 0.5) * 0.01).toFixed(5),
            direction: signals[idx],
            cls: cls[idx],
            probability: Math.floor(Math.random() * 35) + 60,
            rsi: (Math.random() * 40 + 30).toFixed(1),
            macd: (Math.random() * 0.01 - 0.005).toFixed(5),
            score: (Math.random() * 6 - 3).toFixed(1),
            reason: reasons[idx % reasons.length],
            tf: tf
        };
    }

    function showResult(data) {
        const box = document.getElementById('result-box');
        const dir = data.direction;
        const cls = data.cls || 'hold';
        const prob = data.probability || 50;

        box.innerHTML = `
            <div class="result-row">
                <span class="result-label">📊 Направление</span>
                <span class="result-value ${cls}">${dir}</span>
            </div>
            <div class="result-row">
                <span class="result-label">🎯 Вероятность</span>
                <span class="result-value">${prob}%</span>
            </div>
            <div class="result-row">
                <span class="result-label">⏱️ Таймфрейм</span>
                <span class="result-value">${data.tf || currentTf} сек</span>
            </div>
            <div class="result-row">
                <span class="result-label">💵 Цена</span>
                <span class="result-value">${data.price || '--'}</span>
            </div>
            <div class="result-row">
                <span class="result-label">📈 RSI</span>
                <span class="result-value">${data.rsi || '--'}</span>
            </div>
            <div class="result-row">
                <span class="result-label">📉 MACD</span>
                <span class="result-value">${data.macd || '--'}</span>
            </div>
            <div class="result-row">
                <span class="result-label">🎯 Скор</span>
                <span class="result-value">${data.score || '--'}</span>
            </div>
            <div class="result-reason">
                <strong>Причина:</strong> ${data.reason || 'Нет данных'}
            </div>
        `;
    }

    async function updateBestPairs() {
        const list = document.getElementById('best-pair-list');
        try {
            const data = await getBestPairs();
            if (data.length === 0) throw new Error('Нет данных');
            let html = '';
            data.forEach((item, index) => {
                const emoji = item.direction.includes('BUY') ? '🟢' : item.direction.includes('SELL') ? '🔴' : '⚪';
                const cls = item.direction.includes('BUY') ? 'best-signal-buy' : item.direction.includes('SELL') ? 'best-signal-sell' : '';
                html += `
                    <div class="best-pair-item">
                        <span>${index+1}. ${emoji} ${item.pair}</span>
                        <span class="${cls}">${item.direction} (${item.probability}%)</span>
                    </div>
                `;
            });
            list.innerHTML = html;
        } catch (e) {
            list.innerHTML = '<div style="color:var(--text-muted); font-size:13px;">Бэкенд не доступен</div>';
        }
    }

    document.querySelectorAll('.pair-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentPair = this.dataset.pair;
        });
    });

    document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentTf = parseInt(this.dataset.tf);
        });
    });

    document.getElementById('forecast-btn').addEventListener('click', async function() {
        this.innerHTML = '⏳ АНАЛИЗ...';
        this.disabled = true;

        let data = await getSignalFromBackend(currentPair, currentTf);
        if (!data || data.error) {
            data = generateEmulation(currentPair, currentTf);
        }
        showResult(data);
        updateBestPairs();

        this.innerHTML = '📊 АНАЛИЗ';
        this.disabled = false;
    });

    updateBestPairs();
    showResult(generateEmulation('EURUSD-OTC', 3));

    console.log('✦ SAFRONIX GRAFICS OTC LOADED');
    console.log('📡 Подключён к бэкенду:', API_URL);
</script>
</body>
    </html>
