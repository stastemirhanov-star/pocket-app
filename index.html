<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>GOD TRADER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #0f0f1a;
            color: #fff;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 20px;
            color: #f5a623;
        }
        .price-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid #2a2a4e;
        }
        .price {
            font-size: 32px;
            font-weight: bold;
            color: #4fc3f7;
        }
        .price-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            color: #fff;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-buy {
            background: #2e7d32;
        }
        .btn-sell {
            background: #c62828;
        }
        .btn-signal {
            background: #f9a825;
            color: #000;
        }
        .btn-grid {
            background: #1565c0;
        }
        .btn-status {
            background: #6a1b9a;
        }
        .btn-chart {
            background: #00695c;
        }
        .btn-small {
            padding: 10px;
            font-size: 14px;
        }
        .signal-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #2a2a4e;
        }
        .signal-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #222;
        }
        .signal-row:last-child {
            border-bottom: none;
        }
        .label {
            color: #aaa;
        }
        .value {
            font-weight: bold;
        }
        .value.buy {
            color: #4caf50;
        }
        .value.sell {
            color: #ef5350;
        }
        .value.hold {
            color: #ffeb3b;
        }
        .grid-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #2a2a4e;
            font-size: 13px;
        }
        .grid-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .chart-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #2a2a4e;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            overflow-x: auto;
            min-height: 80px;
        }
        .log-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #2a2a4e;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
        }
        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #111;
            color: #aaa;
        }
        .log-entry .time {
            color: #666;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 11px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online {
            background: #4caf50;
        }
        .status-dot.offline {
            background: #ef5350;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🚀 GOD TRADER</h1>
        <span id="status"><span class="status-dot online"></span>Live</span>
    </div>

    <div class="price-box">
        <div class="price" id="price">1.20000</div>
        <div class="price-label">EURUSD • Обновление: <span id="update-time">--</span></div>
    </div>

    <div class="grid-2">
        <button class="btn btn-buy" onclick="sendAction('buy', 10)">🟢 BUY 10$</button>
        <button class="btn btn-sell" onclick="sendAction('sell', 10)">🔴 SELL 10$</button>
        <button class="btn btn-buy btn-small" onclick="sendAction('buy', 25)">🟡 BUY 25$</button>
        <button class="btn btn-sell btn-small" onclick="sendAction('sell', 25)">🔵 SELL 25$</button>
    </div>

    <div class="grid-2">
        <button class="btn btn-signal btn-small" onclick="getSignal()">📡 Сигнал</button>
        <button class="btn btn-grid btn-small" onclick="getGrid()">📊 Сетка</button>
        <button class="btn btn-status btn-small" onclick="getStatus()">📋 Статус</button>
        <button class="btn btn-chart btn-small" onclick="getChart()">📈 График</button>
    </div>

    <div class="signal-box" id="signal-box">
        <div class="signal-row"><span class="label">Направление</span><span class="value hold" id="sig-dir">—</span></div>
        <div class="signal-row"><span class="label">Вероятность</span><span id="sig-prob">—</span></div>
        <div class="signal-row"><span class="label">RSI</span><span id="sig-rsi">—</span></div>
        <div class="signal-row"><span class="label">MACD</span><span id="sig-macd">—</span></div>
        <div class="signal-row"><span class="label">Волатильность</span><span id="sig-vol">—</span></div>
    </div>

    <div class="grid-box" id="grid-box">
        <div style="color:#888; font-size:12px;">📊 Сетка: нажмите «Сетка»</div>
    </div>

    <div class="chart-box" id="chart-box">
        📈 График: нажмите «График»
    </div>

    <div class="log-box" id="log-box">
        <div style="color:#888;">📋 Лог сделок</div>
    </div>

    <div class="footer">GOD TRADER v3.0 • Telegram Web App</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let priceInterval = null;
    let lastPrice = 1.2000;

    function updateTime() {
        document.getElementById('update-time').textContent = new Date().toLocaleTimeString();
    }

    function sendAction(action, amount) {
        tg.sendData(JSON.stringify({ action: action, amount: amount }));
        tg.showPopup({ title: '✅ Отправлено', message: `${action.toUpperCase()} ${amount}$`, buttons: [{ type: 'ok' }] });
    }

    function getSignal() {
        tg.sendData(JSON.stringify({ action: 'get_signal' }));
    }

    function getGrid() {
        tg.sendData(JSON.stringify({ action: 'get_grid' }));
    }

    function getStatus() {
        tg.sendData(JSON.stringify({ action: 'get_status' }));
    }

    function getChart() {
        tg.sendData(JSON.stringify({ action: 'get_chart' }));
    }

    function updatePrice(price) {
        lastPrice = price;
        document.getElementById('price').textContent = price.toFixed(5);
        updateTime();
    }

    function updateSignal(data) {
        const dir = document.getElementById('sig-dir');
        dir.textContent = data.direction || '—';
        dir.className = 'value ' + (data.direction || '').toLowerCase();
        document.getElementById('sig-prob').textContent = data.probability ? data.probability + '%' : '—';
        document.getElementById('sig-rsi').textContent = data.rsi || '—';
        document.getElementById('sig-macd').textContent = data.macd || '—';
        document.getElementById('sig-vol').textContent = data.volatility ? data.volatility + '%' : '—';
    }

    function updateGrid(data) {
        const box = document.getElementById('grid-box');
        if (!data || Object.keys(data).length === 0) {
            box.innerHTML = '<div style="color:#888;">📊 Нет данных</div>';
            return;
        }
        let html = '';
        for (const [key, val] of Object.entries(data)) {
            html += `<div class="grid-row"><span>${key}</span><span>${val}</span></div>`;
        }
        box.innerHTML = html;
    }

    function updateStatus(data) {
        const box = document.getElementById('log-box');
        if (!data) {
            box.innerHTML = '<div style="color:#888;">📋 Нет данных</div>';
            return;
        }
        const time = data.time || '--';
        const action = data.action || '—';
        const details = JSON.stringify(data, null, 2);
        box.innerHTML = `<div class="log-entry"><span class="time">${time}</span> ${action}</div><pre style="color:#aaa;font-size:11px;margin-top:4px;">${details}</pre>`;
    }

    function updateChart(data) {
        const box = document.getElementById('chart-box');
        if (!data || data.length < 2) {
            box.textContent = '📈 Недостаточно данных';
            return;
        }
        const min = Math.min(...data);
        const max = Math.max(...data);
        const range = max - min || 1;
        let lines = [];
        const step = Math.max(1, Math.floor(data.length / 30));
        for (let i = 0; i < data.length; i += step) {
            const val = data[i];
            const norm = Math.floor((val - min) / range * 10);
            const bar = '█'.repeat(Math.max(1, norm)) + '░'.repeat(10 - Math.max(1, norm));
            lines.push(bar);
        }
        box.textContent = '📊 ' + lines.join(' ');
    }

    // Обработка ответов от бота
    tg.onEvent('mainButtonClicked', function() {});
    tg.onEvent('backButtonClicked', function() {});

    // Получение данных от бота (через WebAppData)
    tg.onEvent('popupClosed', function() {});

    // Эмуляция получения данных (в реальности через sendData)
    // Бот будет отправлять ответы как новые сообщения, но в WebApp мы можем
    // использовать tg.sendData и ждать ответ через onEvent 'viewportChanged'? нет.
    // В Telegram WebApp данные от бота приходят как ответ на sendData
    // через событие 'web_app_data' в боте, но в HTML мы получаем только то, что бот
    // отправляет как сообщение. Для полноценной работы нужно, чтобы бот
    // отправлял данные в виде JSON в сообщении, а мы их парсим.
    // Но проще: бот отправляет ответы как текстовые сообщения, а мы их не видим.
    // Поэтому мы используем sendData и бот отвечает в том же чате, а не в WebApp.
    // Для работы внутри WebApp нужно использовать WebSocket или Long Polling,
    // но это сложно. Я даю рабочий вариант: все действия через sendData,
    // ответы приходят в чат, а в WebApp мы обновляем данные по кнопкам.

    // Запрос цены каждые 2 секунды (эмуляция)
    setInterval(() => {
        const change = (Math.random() - 0.5) * 0.002;
        const newPrice = lastPrice + change;
        updatePrice(Math.round(newPrice * 100000) / 100000);
    }, 2000);

    // При первом запуске
    updatePrice(lastPrice);
    updateTime();
    getSignal();
    getGrid();

    console.log('🚀 GOD TRADER Web App loaded');
</script>
</body>
</html>
