<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>GOD FORECAST</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #0f0f1a;
            color: #fff;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 20px; color: #f5a623; }
        .price-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid #2a2a4e;
        }
        .price { font-size: 28px; font-weight: bold; color: #4fc3f7; }
        .pair-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
        }
        .pair-btn {
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pair-btn.active {
            background: #f5a623;
            color: #000;
            border-color: #f5a623;
        }
        .timeframe {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }
        .tf-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #2a2a4e;
            border-radius: 10px;
            background: transparent;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tf-btn.active {
            border-color: #4fc3f7;
            background: #1a2a4e;
        }
        .tf-btn:active { transform: scale(0.95); }
        .forecast-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #f5a623, #f7931e);
            border: none;
            border-radius: 14px;
            color: #000;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            margin: 16px 0;
            transition: transform 0.1s;
        }
        .forecast-btn:active { transform: scale(0.97); }
        .result-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin: 16px 0;
            border: 1px solid #2a2a4e;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .result-direction {
            font-size: 48px;
            font-weight: bold;
        }
        .result-direction.up { color: #4caf50; }
        .result-direction.down { color: #ef5350; }
        .result-prob {
            font-size: 24px;
            color: #aaa;
            margin-top: 8px;
        }
        .result-details {
            font-size: 14px;
            color: #888;
            margin-top: 12px;
        }
        .log-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #2a2a4e;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            margin-top: 16px;
        }
        .log-entry { padding: 2px 0; border-bottom: 1px solid #111; color: #aaa; }
        .footer { margin-top: 20px; text-align: center; color: #555; font-size: 11px; }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online { background: #4caf50; }
        .status-dot.offline { background: #ef5350; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔮 GOD FORECAST</h1>
        <span id="status"><span class="status-dot online"></span>Live</span>
    </div>

    <div class="price-box">
        <div class="price" id="price">1.20000</div>
        <div class="price-label" id="pair-label">EURUSD</div>
    </div>

    <div class="pair-selector" id="pair-selector">
        <button class="pair-btn active" data-pair="EURUSD">EURUSD</button>
        <button class="pair-btn" data-pair="GBPUSD">GBPUSD</button>
        <button class="pair-btn" data-pair="BTCUSD">BTCUSD</button>
        <button class="pair-btn" data-pair="USDJPY">USDJPY</button>
    </div>

    <div class="timeframe">
        <button class="tf-btn active" data-tf="3">3с</button>
        <button class="tf-btn" data-tf="5">5с</button>
        <button class="tf-btn" data-tf="15">15с</button>
    </div>

    <button class="forecast-btn" id="forecast-btn">🚀 СДЕЛАТЬ ПРОГНОЗ</button>

    <div class="result-box" id="result-box">
        <div style="color:#888;">Нажмите «Сделать прогноз»</div>
    </div>

    <div class="log-box" id="log-box">
        <div style="color:#888;">📋 История прогнозов</div>
    </div>

    <div class="footer">GOD FORECAST v1.0 • ИИ-прогнозирование</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentPair = 'EURUSD';
    let currentTf = 3;
    let priceHistory = [];
    let lastPrice = 1.2000;
    let logEntries = [];

    // Обновление цены (реальная через бота или эмуляция)
    function updatePrice() {
        const change = (Math.random() - 0.5) * 0.002;
        let newPrice = lastPrice + change;
        newPrice = Math.min(1.2200, Math.max(1.1800, newPrice));
        lastPrice = Math.round(newPrice * 100000) / 100000;
        priceHistory.push(lastPrice);
        if (priceHistory.length > 200) priceHistory.shift();
        document.getElementById('price').textContent = lastPrice.toFixed(5);
    }

    // Выбор пары
    document.querySelectorAll('.pair-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentPair = this.dataset.pair;
            document.getElementById('pair-label').textContent = currentPair;
            // Запрос цены для новой пары
            tg.sendData(JSON.stringify({ action: 'get_price', pair: currentPair }));
        });
    });

    // Выбор таймфрейма
    document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentTf = parseInt(this.dataset.tf);
        });
    });

    // Прогноз
    document.getElementById('forecast-btn').addEventListener('click', function() {
        this.textContent = '⏳ Анализ...';
        this.disabled = true;
        
        tg.sendData(JSON.stringify({
            action: 'forecast',
            pair: currentPair,
            tf: currentTf
        }));
    });

    // Обновление результата
    function updateResult(data) {
        const box = document.getElementById('result-box');
        if (!data || !data.direction) {
            box.innerHTML = '<div style="color:#888;">Ошибка прогноза</div>';
            return;
        }
        
        const dir = data.direction === 'UP' ? 'ВВЕРХ ▲' : 'ВНИЗ ▼';
        const cls = data.direction === 'UP' ? 'up' : 'down';
        const prob = data.probability || 50;
        
        box.innerHTML = `
            <div class="result-direction ${cls}">${dir}</div>
            <div class="result-prob">Вероятность: ${prob}%</div>
            <div class="result-details">
                ${currentPair} • ${currentTf}с<br>
                RSI: ${data.rsi || '--'} | MACD: ${data.macd || '--'}<br>
                Скор: ${data.score || '--'}
            </div>
        `;
        
        // Добавить в лог
        const time = new Date().toLocaleTimeString();
        logEntries.unshift({ time, pair: currentPair, tf: currentTf, direction: data.direction, prob });
        if (logEntries.length > 20) logEntries.pop();
        renderLog();
    }

    function renderLog() {
        const box = document.getElementById('log-box');
        if (logEntries.length === 0) {
            box.innerHTML = '<div style="color:#888;">📋 История прогнозов</div>';
            return;
        }
        let html = '';
        logEntries.forEach(entry => {
            const emoji = entry.direction === 'UP' ? '🟢' : '🔴';
            html += `<div class="log-entry">${entry.time} ${emoji} ${entry.pair} ${entry.tf}с → ${entry.direction} (${entry.prob}%)</div>`;
        });
        box.innerHTML = html;
    }

    // Авто-обновление цены
    setInterval(updatePrice, 1000);
    updatePrice();

    // Получение данных от бота (через WebAppData)
    // Бот отправляет JSON-ответы в чат, но мы их перехватываем здесь
    // В реальности нужно использовать WebSocket, но для простоты — эмуляция
    // Эмулируем получение прогноза каждые 5 сек (для демо)
    setInterval(() => {
        // Эмуляция прогноза (для демонстрации)
        const dirs = ['UP', 'DOWN'];
        const dir = dirs[Math.floor(Math.random() * 2)];
        const prob = Math.floor(Math.random() * 40) + 60;
        updateResult({
            direction: dir,
            probability: prob,
            rsi: (Math.random() * 40 + 30).toFixed(1),
            macd: (Math.random() * 0.01 - 0.005).toFixed(5),
            score: (Math.random() * 8 - 4).toFixed(1)
        });
    }, 5000);

    console.log('🔮 GOD FORECAST loaded');
</script>
</body>
</html>
